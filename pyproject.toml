[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmagma"
version = "0.1.0"
description = "Multi-trait SNP-wise mean gene analysis from GWAS summary statistics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
maintainers = [{name = "Chen Yang", email = "cafferychen777@tamu.edu"}]
keywords = ["GWAS", "statistical genetics", "gene analysis", "LD"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "bed-reader>=1.0", "threadpoolctl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4", "mpmath>=1.3"]
dev = ["fastmagma[test]", "build>=1", "twine>=6", "ruff>=0.11"]

[project.scripts]
fastmagma = "fastmagma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
