name: Tests and distributions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]' build twine ruff
      - run: ruff check src tests scripts benchmarks
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install wheel and test outside checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cp -R tests "$RUNNER_TEMP/fastmagma-tests"
          cp -R scripts "$RUNNER_TEMP/scripts"
          cd "$RUNNER_TEMP"
          python -m pytest fastmagma-tests --import-mode=importlib
          python -m fastmagma --version
  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'numpy==1.24.0' 'pandas==2.0.0' 'scipy==1.10.0' 'bed-reader==1.0.0' 'threadpoolctl==3.1.0' '.[test]'
      - run: python -m pytest
